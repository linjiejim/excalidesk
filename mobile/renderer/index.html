<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; }
      #stage svg { display: block; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      // 页面加载出错时原生侧能读到原因（超时报错里带上）
      window.__errors = [];
      window.addEventListener('error', (e) => window.__errors.push(String(e.message || e.type) + ' @ ' + (e.filename || (e.target && e.target.src) || '')), true);
      window.addEventListener('unhandledrejection', (e) => window.__errors.push('rejection: ' + String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
