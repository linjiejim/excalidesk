<!doctype html>
<!-- Template for site/og.png (1200×630), rendered by scripts/site-screens.mjs -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Excalifont";
        src: url("../site/fonts/excalifont-latin.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        color: #1e1e1e;
        background: #fbfaf7 radial-gradient(circle at 1px 1px, rgba(105, 101, 219, 0.22) 1.2px, transparent 1.5px) 0 0 / 26px 26px;
        position: relative;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 70px;
        width: 520px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 30px;
        font-weight: 680;
        letter-spacing: -0.01em;
      }
      .brand img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        box-shadow: 0 8px 20px -6px rgba(40, 36, 120, 0.35);
      }
      h1 {
        margin: 56px 0 0;
        font-size: 66px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 780;
      }
      h1 em {
        font-style: normal;
        color: #5b57d1;
      }
      p {
        margin: 26px 0 0;
        font: 26px/1.35 "Excalifont", cursive;
        color: #5b57d1;
      }
      .shot {
        position: absolute;
        left: 640px;
        top: 70px;
        width: 860px;
        border-radius: 14px;
        border: 1px solid rgba(30, 30, 30, 0.2);
        box-shadow: 0 30px 70px -24px rgba(40, 36, 120, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../site/icon.png" alt="" />Excalidesk</div>
      <h1>Excalidraw, <em>at home</em> on your Mac.</h1>
      <p>Plain .excalidraw files · iCloud · 120Hz · agents sketch with you</p>
    </div>
    <img class="shot" src="../site/screens/en/main-light.webp" alt="" />
  </body>
</html>
